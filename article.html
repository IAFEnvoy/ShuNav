<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>文章 - ShuNav</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&family=Noto+Sans+SC:wght@400;500;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="./styles.css">
</head>

<body class="article-page">
  <div class="layout">
    <header class="article-topbar">
      <a class="article-topbar-title" href="./index.html">🐭🐭导航</a>
      <span class="article-topbar-subtitle">SHU人自己的导航站</span>
    </header>

    <main class="content">
      <section class="article-panel">
        <article id="articleBody" class="markdown-body">
          <p class="loading-state">正在加载文章…</p>
        </article>
      </section>
    </main>
  </div>

  <style>
    /* 仅针对 article 页面顶栏样式，不影响 index.html */
    body.article-page .layout {
      display: block;
    }

    .article-topbar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 20px;
      border-bottom: 1px solid #e6e6e6;
      background: #ffffff;
    }

    .article-topbar-title {
      font-family: inherit;
      font-size: 18px;
      font-weight: 700;
      color: inherit;
      text-decoration: none;
      display: inline-block;
      line-height: 1;
    }

    .article-topbar-subtitle {
      color: #666666;
      font-size: 14px;
      margin-left: 6px;
    }

    .article-panel {
      padding: 20px;
    }

    .markdown-body {
      max-width: 900px;
      margin: 18px auto;
      padding: 0 12px;
    }
  </style>

  <script src="./marked.min.js"></script>
  <script type="module">
    import { openNetworkConnectPage } from './open-link.js';
    const btn = document.getElementById('connectNetworkBtn');
    if (btn) btn.addEventListener('click', openNetworkConnectPage);
  </script>

  <script>
    (function () {
      const params = new URLSearchParams(window.location.search);
      const fileParam = params.get('file') || '';
      const bodyEl = document.getElementById('articleBody');

      function show404() {
        bodyEl.innerHTML = '<p class="error-state">未找到对应文章。请检查文件名或返回首页。</p>';
        document.title = '404 - 未找到文章';
      }

      function showError(msg) {
        bodyEl.innerHTML = '<p class="error-state">' + (msg || '加载失败') + '</p>';
        document.title = '错误 - 文章';
      }

      function sanitize(name) {
        if (!name) return '';
        let s = name.replace(/\\/g, '/').replace(/^\/+/, '');
        if (s.includes('..')) return '';
        if (!/^[\w\-\/]+$/.test(s)) return '';
        return s;
      }

      const safe = sanitize(fileParam);
      if (!safe) {
        show404();
        return;
      }

      const sources = [
        '/resource/article/' + safe + '.md',
        './resource/article/' + safe + '.md'
      ];

      (async function load() {
        for (const src of sources) {
          try {
            const res = await fetch(src, { cache: 'no-store' });
            if (!res.ok) {
              if (res.status === 404) continue;
              throw new Error('HTTP ' + res.status);
            }
            const md = await res.text();
            let html = '';
            try {
              if (window.marked && typeof marked.parse === 'function') html = marked.parse(md);
              else if (window.marked && typeof marked === 'function') html = marked(md);
              else html = '<pre>' + escapeHtml(md) + '</pre>';
            } catch (e) {
              console.error('marked parse error', e);
              html = '<pre>' + escapeHtml(md) + '</pre>';
            }

            bodyEl.innerHTML = html;
            const h1 = bodyEl.querySelector('h1');
            if (h1)
              document.title = h1.textContent + ' - 文章';
            else {
              const name = safe.split('/').pop();
              document.title = name + ' - 文章';
            }
            return;
          } catch (e) {
            console.warn('fetch error', e);
            continue;
          }
        }
        show404();
      })();

      function escapeHtml(str) {
        return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      }
    })();
  </script>
</body>

</html>
